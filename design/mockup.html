<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubeLaunch Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Everything inside .tv is in real GameCube pixels (640x480). The 3D carousel
     maps to the GameCube GPU (GX): each case is a textured box drawn in perspective. */
  :root { --page: #1b1b22; --panel: #26262f; --panel-text: #e4e4ea; }
  .tv {
    --bg-top: #1a1830; --bg-floor: #07070c; --hl: #00c3e3; --hl2: #38f2ff;
    --text: #ffffff; --dim: #9a9ab0; --error: #ff4f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--page); color: var(--panel-text);
    font: 14px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 24px;
    padding: 24px 16px; justify-content: center; align-items: flex-start;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 100%; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tabs button { background: var(--panel); color: var(--panel-text); border: 1px solid #3a3a46;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .tabs button.on { background: #3a3a50; border-color: #6a6a90; }
  .frame { width: min(960px, calc(100vw - 32px)); aspect-ratio: 4 / 3; border-radius: 18px; padding: 14px;
    background: #000; box-shadow: 0 10px 40px #0008; }
  .frame-inner { width: 100%; height: 100%; position: relative; overflow: hidden; border-radius: 8px; }
  .hint { color: #9a9aa8; font-size: 13px; text-align: center; }

  /* ---------------- TV (640x480) ---------------- */
  .tv { width: 640px; height: 480px; position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(260px 170px at 50% 330px, color-mix(in srgb, var(--hl) 22%, transparent), transparent 70%),
      radial-gradient(420px 260px at 50% 120px, #ffffff14, transparent 70%),
      linear-gradient(var(--bg-top) 0, var(--bg-top) 300px, var(--bg-floor) 340px, var(--bg-floor)); }
  /* floor grid that recedes into the distance */
  .floor { position: absolute; left: -320px; right: -320px; top: 318px; height: 400px; transform-origin: 50% 0;
    transform: perspective(300px) rotateX(70deg); opacity: .35;
    background:
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--hl) 40%, transparent) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--hl) 40%, transparent) 0 1px, transparent 1px 48px);
    -webkit-mask-image: linear-gradient(#000, transparent 60%); mask-image: linear-gradient(#000, transparent 60%); }

  /* top bar */
  .avatar { position: absolute; left: 32px; top: 22px; width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #8b6cff, #3ee0c5); display: grid; place-items: center; box-shadow: 0 4px 14px #0008; }
  .avatar i { width: 13px; height: 13px; border: 3px solid #fff; border-radius: 3px; transform: rotate(45deg); }
  .brand { position: absolute; left: 82px; top: 29px; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .status { position: absolute; right: 32px; top: 30px; display: flex; align-items: center; gap: 14px;
    font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip { height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px;
    background: #ffffff12; border: 1px solid #ffffff1c; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--hl); box-shadow: 0 0 8px var(--hl); }

  /* 3D carousel */
  .scene { position: absolute; left: 0; right: 0; top: 70px; height: 300px; perspective: 720px; perspective-origin: 50% 40%; }
  .case { position: absolute; left: 245px; top: 46px; width: 150px; height: 208px; transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s, filter .4s; }
  .case.sel .spin { animation: idle 4s ease-in-out infinite; }
  .spin { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s; }
  @keyframes idle { 0%, 100% { transform: rotateY(-9deg) translateY(0); } 50% { transform: rotateY(9deg) translateY(-6px); } }
  .face { position: absolute; backface-visibility: hidden; }
  .front, .back { width: 150px; height: 208px; border-radius: 3px; overflow: hidden; }
  .front { transform: translateZ(11px); }
  .back { transform: rotateY(180deg) translateZ(11px); background: #20202a; }
  .spine { width: 22px; height: 208px; left: 64px; transform: rotateY(-90deg) translateZ(75px);
    display: flex; align-items: center; justify-content: center; }
  .spine span { transform: rotate(-90deg); white-space: nowrap; font-size: 10px; font-weight: 800; letter-spacing: .5px; color: #fff; }
  .edge { width: 22px; height: 208px; left: 64px; transform: rotateY(90deg) translateZ(75px); background: #15151c; }
  .top-f { width: 150px; height: 22px; top: 93px; transform: rotateX(90deg) translateZ(104px); background: #2a2a34; }
  .mirror { width: 150px; height: 208px; top: 210px; transform: translateZ(11px) scaleY(-1); border-radius: 3px; overflow: hidden;
    opacity: .28; -webkit-mask-image: linear-gradient(to top, #000, transparent 45%); mask-image: linear-gradient(to top, #000, transparent 45%); }
  /* cover art */
  .art { position: absolute; inset: 0; }
  .art .band { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: #000000a8; display: flex; align-items: center;
    padding: 0 8px; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: #ffffffd0; }
  .art .mono { position: absolute; left: 12px; top: 36px; font-size: 62px; font-weight: 900; letter-spacing: -3px; color: #fff; line-height: 1; }
  .art .tname { position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12.5px; font-weight: 700; line-height: 1.2; color: #fff; }
  .art .shine { position: absolute; inset: 0; background: linear-gradient(115deg, #ffffff38 0%, transparent 35%, transparent 70%, #ffffff12 100%); }
  .art .hinge { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(90deg, #00000060, transparent); }
  .halo { position: absolute; left: 230px; top: 300px; width: 180px; height: 34px; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--hl) 70%, transparent), transparent);
    filter: blur(4px); animation: halo 2s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: .55; } }

  /* info under the carousel */
  .info { position: absolute; left: 0; right: 0; top: 362px; text-align: center; }
  .info h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
  .info p { margin: 4px 0 0; font-size: 12.5px; color: var(--dim); font-weight: 500; }
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .dots i { width: 5px; height: 5px; border-radius: 3px; background: #ffffff30; transition: width .3s, background .3s; }
  .dots i.on { width: 16px; background: var(--hl); }

  /* bottom hints */
  .bottom { position: absolute; left: 32px; right: 32px; top: 438px; display: flex; align-items: center; gap: 18px;
    font-size: 12.5px; font-weight: 500; color: var(--dim); }
  .bottom .sp { flex: 1; }
  .btn { display: flex; align-items: center; gap: 6px; }
  .btn b { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center;
    background: #fff; color: #111; font-size: 10.5px; font-weight: 800; }

  /* launch: selected case flies to the camera */
  .launching .case:not(.sel) { opacity: 0 !important; }
  .launching .case.sel { transform: translate3d(0, -10px, 260px) !important; }
  .launching .case.sel .spin { animation: none; transform: rotateY(-180deg); }
  .launching .info, .launching .halo, .launching .bottom { opacity: 0; transition: opacity .3s; }
  .progress { position: absolute; left: 220px; right: 220px; top: 420px; height: 4px; border-radius: 2px; background: #ffffff20; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--hl); box-shadow: 0 0 10px var(--hl); }
  .ptext { position: absolute; left: 0; right: 0; top: 394px; text-align: center; font-size: 13px; font-weight: 600; color: var(--dim); }

  .dim-bg { position: absolute; inset: 0; background: #000a; }
  .dialog { position: absolute; left: 120px; right: 120px; top: 150px; border-radius: 14px; background: #2a2a36;
    border: 1px solid #ffffff1c; box-shadow: 0 20px 50px #000c; overflow: hidden; text-align: center;
    transform: perspective(600px) rotateX(8deg); animation: pop .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: perspective(600px) rotateX(35deg) translateY(30px); opacity: 0; } }
  .dialog h2 { margin: 28px 24px 0; font-size: 18px; font-weight: 800; }
  .dialog p { margin: 8px 24px 26px; font-size: 13px; color: var(--dim); }
  .dialog .ok { border-top: 1px solid #ffffff1c; height: 46px; display: grid; place-items: center; font-weight: 700; color: var(--hl); }
  .empty { position: absolute; left: 0; right: 0; top: 170px; text-align: center; }
  .empty .card3d { width: 80px; height: 104px; margin: 0 auto 26px; border-radius: 6px; border: 2px dashed #ffffff40;
    transform: perspective(400px) rotateY(-25deg) rotateX(10deg); }
  .empty h2 { margin: 0; font-size: 20px; font-weight: 800; }
  .empty p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }

  /* ---------------- controls panel ---------------- */
  .panel { background: var(--panel); border-radius: 12px; padding: 16px; width: 280px; max-width: 100%;
    display: flex; flex-direction: column; gap: 10px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .panel input[type=color] { width: 44px; height: 26px; border: none; background: none; padding: 0; cursor: pointer; }
  .panel input[type=range] { width: 130px; }
  .panel p { margin: 0; color: #9a9aa8; font-size: 12.5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="tabs" id="tabs">
    <button data-s="home" class="on">Home</button>
    <button data-s="loading">Launching</button>
    <button data-s="error">Error</button>
    <button data-s="nocard">No card</button>
  </div>
  <div class="frame"><div class="frame-inner" id="fi"><div class="tv" id="tv"></div></div></div>
  <div class="hint">Try it: ←/→ slide through games · Enter = A (launch) · hold ←/→ to fly through</div>
</div>

<div class="panel">
  <h3>Look</h3>
  <label>Highlight <input type="color" id="hl" value="#00c3e3"></label>
  <label>Background <input type="color" id="bg-top" value="#1a1830"></label>
  <label>Side angle <input type="range" id="angle" min="30" max="80" value="58"></label>
  <label>Side spacing <input type="range" id="spacing" min="30" max="80" value="46"></label>
  <p>Each game is a 3D case with a cover, spine and a reflection on the floor. The selected case floats and turns slowly. On the GameCube this would be drawn by its GPU, so the sliding stays smooth at 60 fps.</p>
</div>

const title = n => n.replace(/\.dol$/i, '').replace(/[_-]+/g, ' ');
const fmt = kb => kb >= 1048576 ? (kb / 1048576).toFixed(2) + ' GB' : kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function initials(n) {
  const w = title(n).replace(/([a-z])([A-Z])/g, '$1 $2').split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).replace(/^./, c => c.toUpperCase());
}
function art(n) {
  const h = hash(n) % 360;
  return `<div class="art" style="background:linear-gradient(150deg,hsl(${h} 65% 55%),hsl(${(h + 45) % 360} 70% 26%))">
    <div class="band">HOMEBREW</div><div class="mono">${esc(initials(n))}</div>
    <div class="tname">${esc(title(n))}</div><div class="hinge"></div><div class="shine"></div></div>`;
}
const img = url => `<div class="art" style="background:url(${url}) center/100% 100%"><div class="hinge"></div><div class="shine"></div></div>`;
function caseHtml([n, , , id], i) {
  const h = hash(n) % 360, c = COVERS[id];
  if (c) return `<div class="case" data-i="${i}"><div class="spin">
    <div class="face front">${img(c.front)}</div>
    <div class="face back" style="background:url(${c.back}) center/100% 100%"></div>
    <div class="face spine" style="background:url(${c.spine}) center/100% 100%"></div>
    <div class="face edge"></div><div class="face top-f"></div>
    <div class="face mirror">${img(c.front)}</div></div></div>`;
  return `<div class="case" data-i="${i}"><div class="spin">
    <div class="face front">${art(n)}</div>
    <div class="face back"></div>
    <div class="face spine" style="background:hsl(${(h + 45) % 360} 60% 22%)"><span>${esc(title(n).toUpperCase())}</span></div>
    <div class="face edge"></div><div class="face top-f"></div>
    <div class="face mirror">${art(n)}</div></div></div>`;
}

// Position every case relative to the selected one: centre faces the camera,
// the others turn inwards and stack up on both sides.
function place() {
  tv.querySelectorAll('.case').forEach(c => {
    const off = +c.dataset.i - sel, d = Math.abs(off), s = Math.sign(off);
    let t;
    if (off === 0) t = 'translate3d(0,0,70px)';
    else t = `translate3d(${s * (112 + (d - 1) * spacing)}px,0,${-40 - d * 18}px) rotateY(${-s * angle}deg)`;
    c.style.transform = t;
    c.style.opacity = d > 5 ? 0 : 1;
    c.style.filter = off === 0 ? 'none' : `brightness(${Math.max(.35, .75 - d * .08)})`;
    c.style.zIndex = 100 - d;
    c.classList.toggle('sel', off === 0);
  });
  const g = GAMES[sel];
  const start = tv.querySelector('.bottom .btn');
  if (start) start.innerHTML = `<b>A</b>${g[3] ? 'Play' : 'Start'}`;
  const info = tv.querySelector('.info');
  if (info) info.innerHTML = `<h1>${esc(title(g[0]))}</h1><p>${g[3] ? g[3] + ' · ' : ''}${esc(g[1])}/ · ${fmt(g[2])}</p>
    <div class="dots">${GAMES.map((_, i) => `<i class="${i === sel ? 'on' : ''}"></i>`).join('')}</div>`;
}

function chrome() {
  const t = new Date(), clock = `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`;
  return `<div class="avatar"><i></i></div><div class="brand">CubeLaunch</div>
    <div class="status"><span class="chip"><i></i>SD2SP2</span>${clock}</div>`;
}
function home() {
  return chrome() + `<div class="floor"></div><div class="halo"></div>
    <div class="scene">${GAMES.map(caseHtml).join('')}</div><div class="info"></div>
    <div class="bottom"><div class="btn"><b>A</b>${GAMES[sel][3] ? 'Play' : 'Start'}</div><div class="btn"><b>L</b><b>R</b>Jump 5</div><div class="sp"></div>
    <div class="btn"><b>X</b>SD card</div><div class="btn"><b>START</b>Restart</div></div>`;
}

let timer;
function setScreen(s) {
  screen = s; clearInterval(timer); tv.classList.remove('launching');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  if (s === 'home' || s === 'loading' || s === 'error') { tv.innerHTML = home(); place(); }
  if (s === 'loading') {
    progress = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => tv.classList.add('launching')));
    tv.insertAdjacentHTML('beforeend', `<div class="ptext">Loading ${esc(title(GAMES[sel][0]))}…</div><div class="progress"><i style="width:0"></i></div>`);
    timer = setInterval(() => {
      progress = Math.min(100, progress + 2.5);
      tv.querySelector('.progress i').style.width = progress + '%';
      if (progress >= 100) { clearInterval(timer); setTimeout(() => screen === 'loading' && setScreen('home'), 600); }
    }, 30);
  }
  if (s === 'error') tv.insertAdjacentHTML('beforeend', `<div class="dim-bg"></div><div class="dialog"><h2>Couldn't start the software</h2>
      <p>broken_file.dol isn't a valid DOL file.</p><div class="ok">OK</div></div>`);
  if (s === 'nocard') tv.innerHTML = chrome().replace('SD2SP2', 'No card').replace('var(--hl)', 'var(--error)') +
    `<div class="floor"></div><div class="empty"><div class="card3d"></div><h2>No SD card found</h2>
     <p>Insert a card into SD2SP2 or an SD Gecko.</p></div>
     <div class="bottom"><div class="btn"><b>X</b>Try again</div><div class="btn"><b>Y</b>Demo mode</div></div>`;
}
document.getElementById('tabs').addEventListener('click', e => { if (e.target.dataset.s) setScreen(e.target.dataset.s); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (screen === 'error') { if (e.key === 'Enter' || e.key === 'Backspace') setScreen('home'); return; }
  if (screen !== 'home') return;
  if (e.key === 'ArrowRight') sel = Math.min(GAMES.length - 1, sel + 1);
  else if (e.key === 'ArrowLeft') sel = Math.max(0, sel - 1);
  else if (e.key === 'PageDown' || e.key === 'r') sel = Math.min(GAMES.length - 1, sel + 5);
  else if (e.key === 'PageUp' || e.key === 'l') sel = Math.max(0, sel - 5);
  else if (e.key === 'Enter') { setScreen('loading'); return; }
  else return;
  e.preventDefault(); place();
});

for (const id of ['hl', 'bg-top']) document.getElementById(id).addEventListener('input', e => tv.style.setProperty('--' + id, e.target.value));
document.getElementById('angle').addEventListener('input', e => { angle = +e.target.value; place(); });
document.getElementById('spacing').addEventListener('input', e => { spacing = +e.target.value; place(); });

function fit() {
  const fi = document.getElementById('fi');
  tv.style.transform = `scale(${fi.clientWidth / 640}, ${fi.clientHeight / 480})`;
}
new ResizeObserver(fit).observe(document.getElementById('fi'));
setScreen('home'); fit();
</script>
</body>
</html>
